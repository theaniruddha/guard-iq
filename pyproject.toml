[project]
name = "guard-iq"
version = "0.1.0"
description = "Guardrail Contract Forge — business-type to versioned guardrail contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai-slim[openai,groq]>=0.2",
    "pydantic-settings>=2.0",
    "logfire[fastapi,httpx]>=3.0",
    "pyyaml>=6.0",
    "duckduckgo-search>=7.0",
    "httpx>=0.27",
    "streamlit>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "ddgs>=9.14.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
gc-engine = "gc_forge.engine.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_forge"]

[tool.hatch.build.targets.sdist]
include = ["src/gc_forge", "config", "synthesis_brain.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
